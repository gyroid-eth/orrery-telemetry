[pytest]
# A hung end-to-end test used to sit for 10+ minutes and leave the daemons it
# spawned running (62 of them were found on one machine, days old). Fail fast
# instead: no single test in this suite legitimately needs two minutes.
timeout = 120
# Default (signal) method: the timeout raises inside the test, so `finally`
# blocks still terminate spawned processes. The thread method would abort the
# whole pytest process and leak them again.
# Always show where the time goes, so the slow tail is measured, not guessed.
addopts = --durations=25 --durations-min=1.0
