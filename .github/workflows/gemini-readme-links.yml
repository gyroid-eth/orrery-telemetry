name: one-shot Gemini README links

on:
  push:
    branches:
      - tmp/gemini-readme-links
    paths:
      - .github/workflows/gemini-readme-links.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/gemini-readme-links
          fetch-depth: 0

      - name: Add optional provider links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          edits = [
              (
                  Path("README.md"),
                  "Codex Desktop の root task / subagent も同じ ORRERY Mail と dashboard に接続する場合は、任意の [Codex App 統合](docs/codex-app.md)を追加します。Codex CLI だけを使う場合、この追加 install は不要です。\n\n## 機能ギャラリー",
                  "Codex Desktop の root task / subagent も同じ ORRERY Mail と dashboard に接続する場合は、任意の [Codex App 統合](docs/codex-app.md)を追加します。Codex CLI だけを使う場合、この追加 install は不要です。\n\nGoogle Antigravity / Gemini は、core install 後に追加できる optional provider です。`agy` の導入・認証、provider payload の dry-run / install、delegated child の制約は [Google Antigravity / Gemini provider](docs/antigravity.md) を参照してください。\n\n## 機能ギャラリー",
                  "README provider paragraph",
              ),
              (
                  Path("README.md"),
                  "| [Codex App 統合](docs/codex-app.md) | Codex Desktop plugin、Bridge、session-bound MCP、inbox 通知、cold wake |\n| [Dashboard](docs/dashboard.md) |",
                  "| [Codex App 統合](docs/codex-app.md) | Codex Desktop plugin、Bridge、session-bound MCP、inbox 通知、cold wake |\n| [Google Antigravity / Gemini provider](docs/antigravity.md) | optional provider、launcher、delegated child、permission、実機検証 |\n| [Dashboard](docs/dashboard.md) |",
                  "README docs table",
              ),
              (
                  Path("README.en.md"),
                  "To connect Codex Desktop root tasks and subagents to the same ORRERY Mail project and dashboard, add the optional [Codex App integration](docs/codex-app.en.md). Codex CLI-only setups do not need this additional install.\n\n## Feature gallery",
                  "To connect Codex Desktop root tasks and subagents to the same ORRERY Mail project and dashboard, add the optional [Codex App integration](docs/codex-app.en.md). Codex CLI-only setups do not need this additional install.\n\nGoogle Antigravity / Gemini is an optional provider that can be added after the core install. See [Google Antigravity / Gemini provider](docs/antigravity.en.md) for `agy` installation/authentication prerequisites, provider-payload dry-run/install, and delegated-child constraints.\n\n## Feature gallery",
                  "English README provider paragraph",
              ),
              (
                  Path("README.en.md"),
                  "| [Codex App integration](docs/codex-app.en.md) | Codex Desktop plugin, Bridge, session-bound MCP, inbox notices, and cold wake |\n| [Dashboard](docs/dashboard.en.md) |",
                  "| [Codex App integration](docs/codex-app.en.md) | Codex Desktop plugin, Bridge, session-bound MCP, inbox notices, and cold wake |\n| [Google Antigravity / Gemini provider](docs/antigravity.en.md) | Optional provider, launcher, delegated child, permissions, and measured validation |\n| [Dashboard](docs/dashboard.en.md) |",
                  "English README docs table",
              ),
          ]

          for path, old, new, label in edits:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate links and diff
        shell: bash
        run: |
          test -f docs/antigravity.md
          test -f docs/antigravity.en.md
          grep -Fq 'docs/antigravity.md' README.md
          grep -Fq 'docs/antigravity.en.md' README.en.md
          git diff --check

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gemini-readme-links.yml
          git add README.md README.en.md
          git diff --cached --check
          git commit -m "docs(gemini): link optional provider from READMEs"
          git push origin HEAD:tmp/gemini-readme-links
