name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-service-linux:
    # 合成storeだけ。WSL/D-Bus/unlockや実providerの受入ではない。
    runs-on: ubuntu-latest
    name: native credential references (Ubuntu)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.3.0"
      - run: python -m pip install pytest pytest-timeout pytest-asyncio -e ./packages/agentstack_mail pyyaml
      - name: Check references, generators, guards and offline balance
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -q tests/test_llm_secret_reader.py
          tests/test_dsh_thin_config.py tests/test_hermes_thin_config.py
          tests/test_llm_key_read_guard.py tests/test_harness_runtime.py
          tests/test_deepseek_balance.py tests/test_install_service_path.py -k 'not NativeThinConfig'
      - name: Check the dsh credential adapter with synthetic helpers
        run: node --test --test-name-pattern='one memory lookup|secret service reader' tests/test_dsh_thin_credentials.mjs

  portable-startup:
    # These regressions cover portable components, not a full Windows install.
    runs-on: windows-latest
    name: portable startup (Windows)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-timeout -e ./packages/agentstack_mail
      - name: Measure node start-up (first call is cold)
        shell: pwsh
        run: |
          foreach ($i in 1..2) {
            $t = Measure-Command { node -e 0 }
            "node start #${i}: $([int]$t.TotalMilliseconds) ms"
          }
      - name: Check checkout bytes, long Mail paths, and dashboard HTTP startup
        env:
          PYTHONPATH: .
          PYTHONUTF8: "1"
        run: >-
          python -m pytest -q tests/windows/ tests/test_mail_fixture_line_endings.py
          tests/test_dashboard_startup.py tests/test_codex_app_runtime_provider.py
          tests/test_dashboard_quotas.py tests/test_dashboard_quota_http.py
          tests/test_dashboard_quota_adapters.py tests/test_codex_models.py

  watcher-linux:
    # The Mail watcher is the one component that behaves differently on Linux:
    # fswatch there is inotify, which reports a signal in a brand-new recipient
    # folder late or not at all. Only the watcher's tests run here, with the
    # real fswatch; the full suite stays on macOS (see the tests job).
    runs-on: ubuntu-latest
    name: mail watcher (Linux)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fswatch
        run: sudo apt-get update && sudo apt-get install -y fswatch
      - run: python -m pip install pytest pytest-timeout
      - name: Run watcher tests
        run: |
          set -euo pipefail
          fswatch --version | head -n 1
          # -s keeps the measured delivery latencies in the log.
          PYTHONPATH=. python -m pytest -q -s tests/test_mail_watcher_recovery_scan.py tests/test_notify_importance_filter.py

  tests:
    # 対応 OS は macOS（README「対応環境」）。ubuntu で回すと launchd / launchctl /
    # mailctl の rehearsal が環境不在で落ち、対応外の失敗と本物の回帰が混ざる。
    # 2026-09-03 の公開まで ubuntu で 22 run 連続赤だったのはこれ。
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # README が「3.11 以上」と書く以上、両端を機械で押さえる。"3.x" 単独だと
        # 下限は誰も踏まないし、新しい Python が出た日に上限が黙って動く。
        # 3.10 は 2026-09-04 に対応から外した（import は通るが mail のテストが 38 件落ちる）。
        python-version: ["3.11", "3.12", "3.14"]
    name: tests (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
        with:
          # approved_base is accepted only when a persistent branch, remote, or
          # tag reaches it; shallow history would make that gate inconclusive.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The fresh target tests run the real JS caller with the node on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.3.0"
      # tmux: agents run inside it and tests exercise the real binary.
      # uv: the installer provisions ORRERY Mail with it and fails preflight without it.
      - name: Install tmux and uv
        run: brew install tmux uv
      - name: Install test and package-build tools
        run: python3 -m pip install pytest pytest-timeout pytest-xdist build -e ./packages/agentstack_mail
      # `tests/` だけを指定していた間、integrations/codex_app/tests/ の 111 件は
      # 一度も CI で実行されていなかった。テストの置き場所が増えるたびに黙って
      # 対象から外れるので、ディレクトリは明示して数を数えられるようにする。
      # 一時の診断（＃382 の App 配送の 15 秒超過の原因を CI で観測する）。原因が確定したら
      # この step と下の2 step、Run tests の分岐を消す。3.11/3.12 は元の条件のまま比較対象にする。
      # 記録の置き場所は run・attempt・job を名前に含む mktemp -d で新しく確保し、確保と runner の記録が
      # できた時だけ enabled=true と dir を step output に出す。できなければ診断は無効で元の suite を走らせる。
      - name: Record runner for the App delivery diagnostic
        id: appdiag
        if: matrix.python-version == '3.14'
        run: |
          set -uo pipefail
          off() { echo "app diagnostic UNKNOWN: $1; the suite runs without the diagnostic"; echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0; }
          dir=$(mktemp -d "$RUNNER_TEMP/app-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}.XXXXXX") || off "could not create a new directory"
          # set -e は if や || の条件の中では効かないので、各行を && でつなぎ、どれかが失敗したら診断を無効にする。
          head=$(git rev-parse HEAD) && os=$(sw_vers) && ncpu=$(sysctl -n hw.ncpu) && mem=$(sysctl -n hw.memsize) && py=$(python3 --version) \
            || off "could not read runner metadata"
          ( set -o noclobber; printf '%s\n' \
              "run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} job ${GITHUB_JOB} event ${GITHUB_EVENT_NAME} started $(date -u +%FT%TZ)" \
              "head $head" "$os" "ncpu $ncpu memsize $mem" "$py" \
              "known limit: if neither the marker nor the stderr mark can be written, QUALITY_VALID cannot prove nothing is missing" \
              "diff from the original run: --junitxml added, pytest output also written to pytest-output.txt, only the target node starts the bridge through the diagnostic bootstrap" \
              > "$dir/runner.txt" ) || off "could not write runner metadata"
          { echo "enabled=true"; echo "dir=$dir"; } >> "$GITHUB_OUTPUT"
      - name: Run tests (pytest — `python3 file.py` 直実行は pytest 形式のテストを 0 件実行で緑にしてしまう)
        env:
          ORRERY_FRESH_APP_DIAGNOSTIC: ${{ matrix.python-version == '3.14' && steps.appdiag.outputs.enabled == 'true' && '1' || '' }}
          ORRERY_FRESH_APP_DIAGNOSTIC_NODE: ${{ matrix.python-version == '3.14' && steps.appdiag.outputs.enabled == 'true' && 'packages/agentstack_mail/tests/test_fresh_app_delivery.py::test_real_hook_root_sub_recipient_flush_completion_and_uncertain_ipc' || '' }}
          ORRERY_FRESH_APP_DIAGNOSTIC_DIR: ${{ matrix.python-version == '3.14' && steps.appdiag.outputs.enabled == 'true' && steps.appdiag.outputs.dir || '' }}
        run: |
          set -euo pipefail
          # tests/windows/ is the community Windows lane; its conftest already skips collection off win32,
          # and --ignore keeps that explicit here.
          # -n auto: the suite is a long tail of process-spawning rehearsals (12 min serial on
          # this runner); --dist loadfile keeps one file's tests on one worker, since files
          # share fixtures and fake homes.
          if [ -n "$ORRERY_FRESH_APP_DIAGNOSTIC_DIR" ]; then
            PYTHONPATH=.:packages/agentstack_mail/src python3 -m pytest -q -n auto --dist loadfile tests/ --ignore=tests/windows integrations/ packages/agentstack_mail/tests/ \
              --junitxml="$ORRERY_FRESH_APP_DIAGNOSTIC_DIR/junit.xml" 2>&1 | tee "$ORRERY_FRESH_APP_DIAGNOSTIC_DIR/pytest-output.txt"
          else
            PYTHONPATH=.:packages/agentstack_mail/src python3 -m pytest -q -n auto --dist loadfile tests/ --ignore=tests/windows integrations/ packages/agentstack_mail/tests/
          fi
      # raw の bridge log は公開しない。test 側が書く固定形式の bridge-summary.json、JSONL の実データ、
      # pytest の出力に残る固定印、marker だけを見る。QUALITY_VALID は「この記録を診断に採用してよい」だけを言い、
      # pytest の成否（job の rc が正本）や全段に欠測が無いことは言わない。
      - name: Summarize the App delivery diagnostic
        if: always() && matrix.python-version == '3.14'
        env:
          APP_DIAGNOSTIC_DIR: ${{ steps.appdiag.outputs.enabled == 'true' && steps.appdiag.outputs.dir || '' }}
        run: |
          if [ -z "$APP_DIAGNOSTIC_DIR" ]; then
            echo "verdict INCOMPLETE_OR_UNKNOWN (diagnostic not enabled)"; exit 0
          fi
          python3 - "$APP_DIAGNOSTIC_DIR" <<'EOF'
          import json, os, pathlib, sys
          d = pathlib.Path(sys.argv[1]); out = []; valid = True
          def unknown(what, error):
              global valid
              out.append(f'{what} UNKNOWN {type(error).__name__}'); valid = False
          try:
              summary = json.loads((d / 'bridge-summary.json').read_text())
              ints = ('incomplete_count', 'diagnostic_rows', 'diagnostic_bytes')
              if (set(summary) != {'bridge_log_present', 'diagnostic_present', *ints}
                      or summary['bridge_log_present'] is not True or summary['diagnostic_present'] is not True
                      or any(type(summary[k]) is not int or summary[k] < 0 for k in ints)
                      or summary['diagnostic_rows'] < 1 or summary['diagnostic_bytes'] < 1):
                  raise ValueError('summary shape')
              out += [f'{key} {summary[key]}' for key in sorted(summary)]
              valid = valid and summary['incomplete_count'] == 0
          except Exception as error:
              summary = None; unknown('bridge_summary', error)
          try:
              data = (d / 'app-delivery-diagnostic.jsonl').read_bytes()
              rows = [json.loads(line) for line in data.splitlines()]
              if (not rows or rows[0].get('stage') != 'bootstrap_start' or rows[-1].get('stage') != 'bootstrap_end'
                      or len(rows) >= 2000 or len(data) >= 262144):
                  raise ValueError('jsonl shape')
              if summary is None or (summary['diagnostic_rows'], summary['diagnostic_bytes']) != (len(rows), len(data)):
                  raise ValueError('jsonl does not match summary')
              out.append(f'diagnostic_jsonl rows {len(rows)} bytes {len(data)}')
          except Exception as error:
              unknown('diagnostic_jsonl', error)
          try:
              count = (d / 'pytest-output.txt').read_text(errors='replace').count('FRESH_APP_DIAGNOSTIC_INCOMPLETE')
              out.append(f'pytest_output_incomplete_markers {count}'); valid = valid and count == 0
          except Exception as error:
              unknown('pytest_output', error)
          try:
              os.lstat(d / 'diagnostic-incomplete')
              out.append('diagnostic_incomplete_marker PRESENT'); valid = False
          except FileNotFoundError:
              out.append('diagnostic_incomplete_marker absent')
          except Exception as error:
              unknown('diagnostic_incomplete_marker', error)
          out.append('verdict ' + ('QUALITY_VALID' if valid else 'INCOMPLETE_OR_UNKNOWN'))
          print('\n'.join(out))
          try:
              with (d / 'diagnostic-status.txt').open('x') as stream:
                  stream.write('\n'.join(out) + '\n')
          except Exception as error:
              print(f'diagnostic_status_file UNKNOWN {type(error).__name__}')
          EOF
      - name: Upload the App delivery diagnostic
        if: always() && matrix.python-version == '3.14' && steps.appdiag.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-diagnostic-py314-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.appdiag.outputs.dir }}/app-delivery-diagnostic.jsonl
            ${{ steps.appdiag.outputs.dir }}/junit.xml
            ${{ steps.appdiag.outputs.dir }}/runner.txt
            ${{ steps.appdiag.outputs.dir }}/pytest-output.txt
            ${{ steps.appdiag.outputs.dir }}/bridge-summary.json
            ${{ steps.appdiag.outputs.dir }}/diagnostic-status.txt
            ${{ steps.appdiag.outputs.dir }}/diagnostic-incomplete
          if-no-files-found: warn
          retention-days: 7
      - name: Build and inspect agentstack-mail distribution
        run: |
          set -euo pipefail
          python3 -m build packages/agentstack_mail --outdir /tmp/agentstack-mail-dist
          python3 packages/agentstack_mail/tests/verify_artifact.py /tmp/agentstack-mail-dist/agentstack_mail-0.0.0-py3-none-any.whl
          python3 packages/agentstack_mail/tests/verify_artifact.py /tmp/agentstack-mail-dist/agentstack_mail-0.0.0.tar.gz
          python3 -m pip install --force-reinstall --no-deps /tmp/agentstack-mail-dist/agentstack_mail-0.0.0-py3-none-any.whl
          python3 packages/agentstack_mail/tests/verify_installed_contract.py
