name: tests

on:
  push:
  pull_request:

jobs:
  portable-startup:
    # These regressions cover portable components, not a full Windows install.
    runs-on: windows-latest
    name: portable startup (Windows)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Check checkout bytes and dashboard HTTP startup
        env:
          PYTHONPATH: .
          PYTHONUTF8: "1"
        run: python -m pytest -q tests/test_mail_fixture_line_endings.py tests/test_dashboard_startup.py tests/test_codex_app_runtime_provider.py

  tests:
    # 対応 OS は macOS（README「対応環境」）。ubuntu で回すと launchd / launchctl /
    # mailctl の rehearsal が環境不在で落ち、対応外の失敗と本物の回帰が混ざる。
    # 2026-09-03 の公開まで ubuntu で 22 run 連続赤だったのはこれ。
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # README が「3.11 以上」と書く以上、両端を機械で押さえる。"3.x" 単独だと
        # 下限は誰も踏まないし、新しい Python が出た日に上限が黙って動く。
        # 3.10 は 2026-09-04 に対応から外した（import は通るが mail のテストが 38 件落ちる）。
        python-version: ["3.11", "3.12", "3.14"]
    name: tests (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
        with:
          # approved_base is accepted only when a persistent branch, remote, or
          # tag reaches it; shallow history would make that gate inconclusive.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # tmux: agents run inside it and tests exercise the real binary.
      # uv: the installer provisions AgentStack Mail with it and fails preflight without it.
      - name: Install tmux and uv
        run: brew install tmux uv
      - name: Install test and package-build tools
        run: python3 -m pip install pytest build -e ./packages/agentstack_mail
      # `tests/` だけを指定していた間、integrations/codex_app/tests/ の 111 件は
      # 一度も CI で実行されていなかった。テストの置き場所が増えるたびに黙って
      # 対象から外れるので、ディレクトリは明示して数を数えられるようにする。
      - name: Run tests (pytest — `python3 file.py` 直実行は pytest 形式のテストを 0 件実行で緑にしてしまう)
        run: |
          set -euo pipefail
          PYTHONPATH=.:packages/agentstack_mail/src python3 -m pytest -q tests/ integrations/ packages/agentstack_mail/tests/
      - name: Build and inspect agentstack-mail distribution
        run: |
          set -euo pipefail
          python3 -m build packages/agentstack_mail --outdir /tmp/agentstack-mail-dist
          python3 packages/agentstack_mail/tests/verify_artifact.py /tmp/agentstack-mail-dist/agentstack_mail-0.0.0-py3-none-any.whl
          python3 packages/agentstack_mail/tests/verify_artifact.py /tmp/agentstack-mail-dist/agentstack_mail-0.0.0.tar.gz
          python3 -m pip install --force-reinstall --no-deps /tmp/agentstack-mail-dist/agentstack_mail-0.0.0-py3-none-any.whl
          python3 packages/agentstack_mail/tests/verify_installed_contract.py
