name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run tests (stdlib only — includes the bash 3.2 local-selfref lint)
        run: |
          set -euo pipefail
          rc=0
          for t in tests/test_*.py; do
            echo "== $t =="
            PYTHONPATH=. python3 "$t" || rc=1
          done
          exit "$rc"
