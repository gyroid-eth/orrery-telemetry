[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentstack-mail"
version = "0.0.0"
description = "AgentStack-owned coordination mail service"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-PolyForm-Perimeter-1.0.1 AND LicenseRef-MCP-Agent-Mail"
license-files = ["AGENTSTACK_LICENSE", "UPSTREAM_LICENSE"]
authors = [
  { name = "AgentStack contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentstack_mail"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures" = "agentstack_mail/fixtures"
"NOTICE.md" = "agentstack_mail/NOTICE.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
