[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentstack-mail"
version = "0.0.0"
description = "AgentStack-owned coordination mail service"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Perimeter-1.0.1 AND LicenseRef-MCP-Agent-Mail"
license-files = ["AGENTSTACK_LICENSE", "UPSTREAM_LICENSE"]
authors = [
  { name = "AgentStack contributors" },
]
dependencies = [
  "anyio>=4.5,<5",
  "fastmcp==2.13.0.2",
  # boundary.py intentionally follows Uvicorn's signal-capture contract so
  # FastMCP's outer database lifespan can finish after SIGTERM.
  "uvicorn==0.52.1",
  # FastMCP's generated outputSchema changed in Pydantic 2.13.  The live
  # behavior source uses 2.12.5, so pin it until a versioned schema migration.
  "pydantic==2.12.5",
  "PyYAML>=6.0.2",
  "pathspec>=0.12.1",
  "python-decouple>=3.8",
  "sqlmodel>=0.0.16",
  "sqlalchemy[asyncio]>=2.0.35",
  "aiosqlite>=0.20.0",
  "rich>=13.9.1",
  "pillow>=10.4.0",
  "GitPython>=3.1.43",
  "filelock>=3.16.0",
  "psutil>=6.1.1",
]

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
agentstack-mail = "agentstack_mail.cli:main"
agentstack-mail-migrate = "agentstack_mail.migration:main"
agentstack-mail-service = "agentstack_mail.service:main"
agentstack-mail-consumers = "agentstack_mail.consumer:main"
agentstack-mail-consumer-inventory = "agentstack_mail.consumer_inventory:main"
agentstack-mail-evidence = "agentstack_mail.evidence:main"
agentstack-mail-scale-acceptance = "agentstack_mail.scale_acceptance:main"

[project.optional-dependencies]
legacy-llm = [
  "litellm>=1.40.0,<2",
  "structlog>=24.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentstack_mail"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures" = "agentstack_mail/fixtures"
"NOTICE.md" = "agentstack_mail/NOTICE.md"

[tool.hatch.build.targets.sdist]
# The dirty patch is a repository audit input; the Git bundle is not shipped
# inputs, not runtime source-distribution payloads. NOTICE, both licenses,
# fixtures, source, and tests remain in the sdist.
exclude = [
  "/provenance",
  "/plucky-requirements-2-4.md",
  "/plucky-remaining-blockers.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
