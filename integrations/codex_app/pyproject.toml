[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentstack-codex-app"
version = "0.1.0"
description = "Optional Codex App bridge for claude-agent-stack"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["jsonschema>=4.21"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "integration: starts an installed Codex app-server and is excluded from CI by default",
]
testpaths = ["tests"]
